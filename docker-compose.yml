# Optional: local PostgreSQL 16 for tests, via docker compose.
#   docker compose up -d postgres
#   DATABASE_URL=postgresql+psycopg://postgres:postgres@127.0.0.1:5433/academy_test pytest tests -q
# (Any PostgreSQL 16 instance works; env var DATABASE_URL overrides defaults.)
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: academy_test
    ports:
      - "5433:5432"
